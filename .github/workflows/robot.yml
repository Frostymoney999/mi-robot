name: Robot de trading

on:
  schedule:
    - cron: "7 * * * *"     # cada hora: el robot decide solo si toca informe, señales o nada (según tus ajustes)
    - cron: "0 18 * * 0"    # domingo: reaprende con la semana nueva
  workflow_dispatch:
    inputs:
      modo:
        description: "auto = lo normal · aprender = reentrenar ya · informe = mandar informe ahora"
        default: "informe"
        type: choice
        options: [informe, aprender, auto]

permissions:
  contents: write

concurrency: robot

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BALANCE: ${{ secrets.BALANCE }}
      URL_WEB: ${{ vars.URL_WEB }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy yfinance
      - name: Ejecutar robot
        run: |
          MODO="${{ github.event.inputs.modo }}"
          if [ "${{ github.event.schedule }}" = "0 18 * * 0" ] || [ "$MODO" = "aprender" ]; then
            python robot.py aprender --sin-abrir --resumen
          elif [ "$MODO" = "informe" ]; then
            python robot.py todo --sin-abrir --resumen
          else
            python robot.py auto --sin-abrir
          fi
      - name: Guardar lo aprendido y publicar la app
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add memoria docs
          git diff --cached --quiet || git commit -m "Robot: actualización $(date -u +%F_%H:%M)"
          git pull --rebase -q || true
          git push
